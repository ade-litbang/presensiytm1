    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-rose-50 flex items-center justify-center p-6 text-center">
              <div className="bg-white p-8 rounded-3xl shadow-2xl max-w-md border border-rose-200">
                <div className="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                  <i className="fa-solid fa-triangle-exclamation"></i>
                </div>
                <h2 className="text-xl font-bold text-slate-900 mb-2">Terjadi Kesalahan Sistem</h2>
                <p className="text-xs text-slate-500 mb-6">{this.state.error?.toString()}</p>
                <button 
                  onClick={() => { this.setState({ hasError: false }); window.location.reload(); }}
                  className="px-6 py-3 bg-blue-900 text-white rounded-xl text-xs font-bold hover:bg-blue-800 transition"
                >
                  Muat Ulang Aplikasi
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const Toast = ({ message, type = 'success', onClose }) => {
      useEffect(() => {
        const timer = setTimeout(onClose, 3500);
        return () => clearTimeout(timer);
      }, [onClose]);

      const bg = type === 'success' ? 'bg-emerald-600 text-white' : type === 'error' ? 'bg-rose-600 text-white' : 'bg-blue-800 text-white';
      const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-xmark' : 'fa-circle-info';

      return (
        <div className={`fixed bottom-5 right-5 flex items-center px-4 py-3 rounded-2xl shadow-2xl z-50 transition-all transform animate-fade-in ${bg}`}>
          <i className={`fa-solid ${icon} text-lg mr-3`}></i>

          <button onClick={onClose} className="opacity-75 hover:opacity-100 transition p-1">
            <i className="fa-solid fa-xmark"></i>
          </button>
        </div>
      );

    function App() {
      const [activeUser, setActiveUser] = useState(null);
      const [users, setUsers] = useState([]);
      const [toast, setToast] = useState(null);
      const [sidebarOpen, setSidebarOpen] = useState(false);

      const [loginUsername, setLoginUsername] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [showLoginPassword, setShowLoginPassword] = useState(false);
      const [loginError, setLoginError] = useState('');

      useEffect(() => {
        try {
          // Load Users
          const savedUsers = localStorage.getItem('ytm_users');
          const loadedUsers = savedUsers ? JSON.parse(savedUsers) : DEFAULT_USERS;
          setUsers(loadedUsers);
          if (!savedUsers) {
            localStorage.setItem('ytm_users', JSON.stringify(DEFAULT_USERS));
          }

          // Load Active User session
          const savedActiveUser = localStorage.getItem('ytm_active_user');
          if (savedActiveUser) {
            setActiveUser(JSON.parse(savedActiveUser));
          }

          // Load Classes
          const savedClasses = localStorage.getItem('ytm_classes');
          setClasses(savedClasses ? JSON.parse(savedClasses) : DEFAULT_CLASSES);

          // Load Students
          const savedStudents = localStorage.getItem('ytm_students');
          const loadedStudents = savedStudents ? JSON.parse(savedStudents) : generateDefaultStudents();
          setStudents(loadedStudents);
          if (!savedStudents) {
            localStorage.setItem('ytm_students', JSON.stringify(loadedStudents));
          }

          // Load Attendance Records
          const savedAttendance = localStorage.getItem('ytm_attendance');
          if (savedAttendance) {
            setAttendance(JSON.parse(savedAttendance));
          } else {
            const today = new Date().toISOString().split('T')[0];
            const sampleAtt = [];
            loadedStudents.forEach((s, idx) => {
              let status = 'hadir';
              if (idx % 9 === 0) status = 'sakit';
              else if (idx % 14 === 0) status = 'izin';
              else if (idx % 19 === 0) status = 'alpa';
              sampleAtt.push({ 
                id: genId(), 
                date: today, 
                classId: s.classId, 
                studentId: s.id, 
                status: status,
                note: status !== 'hadir' ? 'Keterangan terpantau' : ''
              });
            });
            setAttendance(sampleAtt);
            localStorage.setItem('ytm_attendance', JSON.stringify(sampleAtt));
          }
        } catch (e) {
          console.error("Error loading application state", e);
        }
      }, []);

      const showToast = (message, type = 'success') => setToast({ message, type });

      const handleAuthLogin = (e) => {
        e.preventDefault();
        setLoginError('');

        const userFound = users.find(
          u => u.username.trim().toLowerCase() === loginUsername.trim().toLowerCase() && u.password === loginPassword
        );

        if (userFound) {
          if (userFound.status === 'Nonaktif') {
            setLoginError('Akun Anda telah dinonaktifkan. Silakan hubungi Admin IT.');
            showToast('Akses ditolak: Akun Nonaktif!', 'error');
            return;
          }
          setActiveUser(userFound);
          localStorage.setItem('ytm_active_user', JSON.stringify(userFound));
          showToast(`Selamat datang kembali, ${userFound.name}!`);
          setLoginUsername('');
          setLoginPassword('');
        } else {
          setLoginError('Username atau Kata Sandi salah! Hubungi Admin IT jika Anda belum memiliki akun.');
          showToast('Gagal Masuk! Otentikasi ditolak.', 'error');
        }
      };

      const handleLogout = () => {
        setActiveUser(null);
        localStorage.removeItem('ytm_active_user');
        showToast('Anda telah keluar dari sistem.', 'info');
      };

      // Helper state synchronizers

    const DashboardView = ({ attendance, classes, students, setActiveTab, user }) => {
      const today = new Date().toISOString().split('T')[0];

      const todayAttendance = useMemo(() => {
        return attendance.filter(a => a.date === today);
      }, [attendance, today]);

      const counts = useMemo(() => {
        let hadir = 0, sakit = 0, izin = 0, alpa = 0;
        todayAttendance.forEach(a => {
          if (a.status === 'hadir') hadir++;
          else if (a.status === 'sakit') sakit++;
          else if (a.status === 'izin') izin++;
          else if (a.status === 'alpa') alpa++;
        });
        const recorded = todayAttendance.length;
        const total = students.length;
        const belumAbsen = Math.max(0, total - recorded);

        return { hadir, sakit, izin, alpa, recorded, total, belumAbsen };
      }, [todayAttendance, students]);

      const pieData = [
        { name: 'Hadir', value: counts.hadir },
        { name: 'Sakit', value: counts.sakit },
        { name: 'Izin', value: counts.izin },
        { name: 'Alpa', value: counts.alpa }
      ];

        return classes.map(cls => {
          const classStudents = students.filter(s => s.classId === cls.id);
          const studentIds = new Set(classStudents.map(s => s.id));
          const clsAtt = todayAttendance.filter(a => studentIds.has(a.studentId));

          let h = 0, s = 0, i = 0, a = 0;
          clsAtt.forEach(item => {
            if (item.status === 'hadir') h++;
            else if (item.status === 'sakit') s++;
            else if (item.status === 'izin') i++;
            else if (item.status === 'alpa') a++;
          });

          return {
            name: cls.name,
            Hadir: h,
            Sakit: s,
            Izin: i,
            Alpa: a

                      <RechartsTooltip />
                      <Legend />

      const [editClass, setEditClass] = useState(null);
      const [deleteTarget, setDeleteTarget] = useState(null);

      const [formData, setFormData] = useState({ name: '', level: 'VII', wali: '', room: '' });

      const handleOpenAdd = () => {
        setFormData({ name: '', level: 'VII', wali: '', room: '' });
        setEditClass(null);
        setIsAddOpen(true);
      };

      const handleOpenEdit = (cls) => {
        setFormData({ name: cls.name, level: cls.level, wali: cls.wali, room: cls.room });
        setEditClass(cls);
        setIsAddOpen(true);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.name.trim()) return;

        if (editClass) {
          const updated = classes.map(c => c.id === editClass.id ? { ...c, ...formData } : c);
          setClasses(updated);
          showToast(`Kelas ${formData.name} berhasil diperbarui!`);
        } else {
          const newCls = { id: genId(), ...formData };
          setClasses([...classes, newCls]);
          showToast(`Kelas ${formData.name} berhasil ditambahkan!`);
        }
        setIsAddOpen(false);
      };

      const handleDelete = () => {
        if (!deleteTarget) return;
        const updated = classes.filter(c => c.id !== deleteTarget.id);
        setClasses(updated);
        showToast(`Kelas ${deleteTarget.name} dihapus.`);
        setDeleteTarget(null);
      };

      return (
        <div className="space-y-6 animate-fade-in">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h3 className="text-lg font-extrabold text-slate-800">Manajemen Data Kelas</h3>
              <p className="text-xs text-slate-500">Kelola daftar kelas dan wali kelas SMP Islam YTM 1 Bogor</p>
            </div>

              onClick={handleOpenAdd}
              className="px-4 py-2.5 bg-blue-950 hover:bg-blue-900 text-white rounded-xl font-bold text-xs shadow-md transition flex items-center gap-2"

              <i className="fa-solid fa-plus"></i>
              <span>Tambah Kelas Baru</span>
            </button>

    const AttendanceInputView = ({ classes, students, attendance, setAttendance, showToast, user }) => {
      const todayStr = new Date().toISOString().split('T')[0];
      const [selectedDate, setSelectedDate] = useState(todayStr);
      const [selectedClassId, setSelectedClassId] = useState(classes[0]?.id || '');

      const [tempStatusMap, setTempStatusMap] = useState({});

      const classStudents = useMemo(() => {
        return students.filter(s => s.classId === selectedClassId);
      }, [students, selectedClassId]);

      useEffect(() => {
        const initialMap = {};
        classStudents.forEach(s => {
          const existing = attendance.find(a => a.date === selectedDate && a.studentId === s.id);
          initialMap[s.id] = {
            status: existing ? existing.status : 'hadir',
            note: existing ? existing.note || '' : ''
          };
        });
        setTempStatusMap(initialMap);
      }, [selectedDate, selectedClassId, classStudents, attendance]);

      const handleStatusChange = (studentId, status) => {
        setTempStatusMap(prev => ({
          ...prev,
          [studentId]: { ...prev[studentId], status }
        }));
      };

      const handleNoteChange = (studentId, note) => {
        setTempStatusMap(prev => ({
          ...prev,
          [studentId]: { ...prev[studentId], note }
        }));
      };

      const handleSetAllHadir = () => {
        const updated = { ...tempStatusMap };
        classStudents.forEach(s => {
          updated[s.id] = { ...updated[s.id], status: 'hadir' };
        });
        setTempStatusMap(updated);
        showToast("Seluruh murid diatur ke 'Hadir'");
      };

      const handleSaveAttendance = () => {
        const newAttendance = [...attendance];

        classStudents.forEach(s => {
          const idx = newAttendance.findIndex(a => a.date === selectedDate && a.studentId === s.id);
          const studentData = tempStatusMap[s.id] || { status: 'hadir', note: '' };

          if (idx >= 0) {
            newAttendance[idx] = {
              ...newAttendance[idx],
              status: studentData.status,
              note: studentData.note
            };
          } else {
            newAttendance.push({
              id: genId(),
              date: selectedDate,
              classId: selectedClassId,
              studentId: s.id,
              status: studentData.status,
              note: studentData.note
            });
          }
        });

        setAttendance(newAttendance);
        showToast(`Presensi kelas untuk tanggal ${selectedDate} berhasil disimpan!`);
      };

      return (

            </div>

                </thead>
                <tbody className="divide-y divide-slate-100 text-xs">
                  {classStudents.length > 0 ? (
                    classStudents.map((s, idx) => {
                      const st = tempStatusMap[s.id] || { status: 'hadir', note: '' };
                      return (
                        <tr key={s.id} className="hover:bg-slate-50 transition">

                                onClick={() => handleStatusChange(s.id, 'hadir')}
                                className={`px-3 py-1.5 rounded-xl text-xs font-extrabold transition ${
                                  st.status === 'hadir' 
                                    ? 'bg-emerald-600 text-white shadow-md' 
                                    : 'text-slate-600 hover:bg-slate-200'
                                }`}
                              >
                                Hadir
                              </button>
                              <button 
                                type="button"
                                onClick={() => handleStatusChange(s.id, 'sakit')}
                                className={`px-3 py-1.5 rounded-xl text-xs font-extrabold transition ${
                                  st.status === 'sakit' 
                                    ? 'bg-amber-500 text-white shadow-md' 
                                    : 'text-slate-600 hover:bg-slate-200'
                                }`}
                              >
                                Sakit
                              </button>
                              <button 
                                type="button"
                                onClick={() => handleStatusChange(s.id, 'izin')}
                                className={`px-3 py-1.5 rounded-xl text-xs font-extrabold transition ${
                                  st.status === 'izin' 
                                    ? 'bg-blue-600 text-white shadow-md' 
                                    : 'text-slate-600 hover:bg-slate-200'
                                }`}
                              >
                                Izin
                              </button>
                              <button 
                                type="button"
                                onClick={() => handleStatusChange(s.id, 'alpa')}
                                className={`px-3 py-1.5 rounded-xl text-xs font-extrabold transition ${
                                  st.status === 'alpa' 
                                    ? 'bg-rose-600 text-white shadow-md' 
                                    : 'text-slate-600 hover:bg-slate-200'
                                }`}
                              >
                                Alpa
                              </button>
                            </div>
                          </td>
                          <td className="py-3 px-4">
                            <input 
                              type="text" 
                              placeholder="Keterangan Tambahan..."
                              value={st.note}
                              onChange={e => handleNoteChange(s.id, e.target.value)}
                              className="w-full px-3 py-1.5 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-blue-700 bg-slate-50"
                            />
                          </td>
                        </tr>
                      );
                    })
                  ) : (
                    <tr>
                      <td colSpan="4" className="py-8 text-center text-slate-400 font-medium">
                        Tidak ada siswa di kelas ini.
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    const HistoryView = ({ classes, students, attendance }) => {
      const [filterClass, setFilterClass] = useState('ALL');

      const filteredRecords = useMemo(() => {
        return attendance.filter(a => {
          if (filterClass === 'ALL') return true;
          return a.classId === filterClass;
        });
      }, [attendance, filterClass]);

      const handlePrint = () => {
        window.print();
      };

      return (
        <div className="space-y-6 animate-fade-in">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 no-print">
            <div>
              <h3 className="text-lg font-extrabold text-slate-800">Riwayat & Rekapitulasi Laporan</h3>
              <p className="text-xs text-slate-500">Laporan histori kehadiran siswa SMP Islam YTM 1 Bogor</p>
            </div>
            <button 
              onClick={handlePrint}
              className="px-4 py-2.5 bg-blue-950 hover:bg-blue-900 text-white rounded-xl font-bold text-xs shadow-md transition flex items-center gap-2"
            >
              <i className="fa-solid fa-print"></i>
              <span>Cetak / Print Laporan</span>
            </button>
          </div>

          {/* Filter Header for Print & Display */}
          <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-center gap-4">
            <div className="w-full sm:w-auto">
              <label className="block text-xs font-bold text-slate-600 mb-1 no-print">Filter Kelas:</label>
              <select 
                value={filterClass}
                onChange={e => setFilterClass(e.target.value)}
                className="w-full sm:w-64 px-3.5 py-2 rounded-xl border border-slate-200 text-xs font-bold bg-white text-slate-800 focus:outline-none focus:border-blue-700"
              >
                <option value="ALL">Semua Kelas</option>
                {classes.map(c => (
                  <option key={c.id} value={c.id}>Kelas {c.name}</option>
                ))}
              </select>
            </div>
            <div className="text-right">
              <span className="text-xs font-bold text-slate-500">Total Log Terekam: </span>
              <span className="text-base font-black text-blue-950">{filteredRecords.length} Catatan</span>
            </div>
          </div>

          {/* Report Log Table */}
          <div className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="bg-slate-100 text-slate-700 text-[11px] font-extrabold uppercase tracking-wider border-b border-slate-200">
                    <th className="py-3.5 px-4">Tanggal</th>
                    <th className="py-3.5 px-4">Nama Siswa</th>
                    <th className="py-3.5 px-4">Kelas</th>
                    <th className="py-3.5 px-4 text-center">Status</th>
                    <th className="py-3.5 px-4">Keterangan</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 text-xs">
                  {filteredRecords.length > 0 ? (
                    filteredRecords.slice(0, 50).map(rec => {
                      const student = students.find(s => s.id === rec.studentId);
                      const cls = classes.find(c => c.id === rec.classId);

                      const badgeBg = rec.status === 'hadir' ? 'bg-emerald-100 text-emerald-800' :
                        rec.status === 'sakit' ? 'bg-amber-100 text-amber-800' :
                        rec.status === 'izin' ? 'bg-blue-100 text-blue-800' : 'bg-rose-100 text-rose-800';

                      return (
                        <tr key={rec.id} className="hover:bg-slate-50 transition">
                          <td className="py-3 px-4 font-mono font-bold text-slate-700">{rec.date}</td>
                          <td className="py-3 px-4 font-bold text-slate-800">{student ? student.name : 'Siswa Dihapus'}</td>
                          <td className="py-3 px-4 font-extrabold text-amber-900">{cls ? cls.name : '-'}</td>
                          <td className="py-3 px-4 text-center">
                            <span className={`px-2.5 py-1 rounded-lg text-[10px] font-black uppercase ${badgeBg}`}>
                              {rec.status}
                            </span>
                          </td>
                          <td className="py-3 px-4 text-slate-500 italic">{rec.note || '-'}</td>
                        </tr>
                      );
                    })
                  ) : (
                    <tr>
                      <td colSpan="5" className="py-8 text-center text-slate-400 font-medium">
                        Tidak ada riwayat presensi terpilih.
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    const QrView = ({ students, classes, attendance, setAttendance, showToast }) => {
      const [selectedStudentId, setSelectedStudentId] = useState(students[0]?.id || '');
      const [scanNisInput, setScanNisInput] = useState('');

      const selectedStudent = useMemo(() => {
        return students.find(s => s.id === selectedStudentId);
      }, [students, selectedStudentId]);

      const studentClass = useMemo(() => {
        return classes.find(c => c.id === selectedStudent?.classId);
      }, [classes, selectedStudent]);

      const handleSimulateScan = (e) => {
        e.preventDefault();
        if (!scanNisInput.trim()) return;

        const student = students.find(s => s.nis.trim() === scanNisInput.trim() || s.nisn.trim() === scanNisInput.trim());

        if (!student) {
          showToast(`Siswa dengan NIS "${scanNisInput}" tidak ditemukan!`, 'error');
          return;
        }

        const todayStr = new Date().toISOString().split('T')[0];
        const existingIdx = attendance.findIndex(a => a.date === todayStr && a.studentId === student.id);

        let updated = [...attendance];
        if (existingIdx >= 0) {
          updated[existingIdx] = { ...updated[existingIdx], status: 'hadir', note: 'Absen via QR Scan' };
        } else {
          updated.push({
            id: genId(),
            date: todayStr,
            classId: student.classId,
            studentId: student.id,
            status: 'hadir',
            note: 'Absen via QR Scan'
          });
        }

        setAttendance(updated);
        showToast(`BERHASIL: ${student.name} dicatat HADIR hari ini!`, 'success');
        setScanNisInput('');
      };

      const qrUrl = selectedStudent ? `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${selectedStudent.nis}` : '';

      return (
        <div className="space-y-6 animate-fade-in">
          <div>
            <h3 className="text-lg font-extrabold text-slate-800">Kartu Presensi QR & Scanner</h3>
            <p className="text-xs text-slate-500">Cetak kartu QR digital murid atau gunakan scanner presensi cepat</p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {/* QR Card Generator */}
            <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
              <h4 className="font-extrabold text-sm text-slate-800 flex items-center gap-2">
                <i className="fa-solid fa-address-card text-blue-800"></i>
                <span>Cetak Kartu Siswa Digital</span>
              </h4>

              <div>
                <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Pilih Siswa</label>
                <select 
                  value={selectedStudentId}
                  onChange={e => setSelectedStudentId(e.target.value)}
                  className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-bold bg-white focus:outline-none focus:border-blue-700"
                >
                  {students.map(s => (
                    <option key={s.id} value={s.id}>{s.name} (NIS: {s.nis})</option>
                  ))}
                </select>
              </div>

              {selectedStudent && (
                <div className="p-6 bg-gradient-to-br from-blue-950 via-blue-900 to-indigo-950 text-white rounded-3xl shadow-xl relative overflow-hidden border-2 border-amber-400/30">
                  <div className="flex justify-between items-start mb-4 border-b border-white/10 pb-3">
                    <div>
                      <h5 className="font-extrabold text-xs tracking-wider">SMP ISLAM YTM 1 BOGOR</h5>
                      <p className="text-[9px] text-amber-400 font-bold uppercase">KARTU PRESENSI DIGITAL</p>
                    </div>
                    <i className="fa-solid fa-graduation-cap text-amber-400 text-xl"></i>
                  </div>

                  <div className="flex items-center gap-4">
                    <div className="bg-white p-2 rounded-2xl shrink-0 shadow-lg">
                      <img src={qrUrl} alt="QR Code Siswa" className="w-24 h-24 object-contain" />
                    </div>

                    <div className="space-y-1">
                      <p className="text-sm font-black tracking-wide text-amber-300">{selectedStudent.name}</p>
                      <p className="text-[11px] font-mono text-slate-200">NIS: {selectedStudent.nis}</p>
                      <p className="text-[11px] font-bold text-slate-300">Kelas: {studentClass ? studentClass.name : '-'}</p>
                      <p className="text-[10px] text-slate-400 pt-1">Sistem Otomasi Presensi YTM 1</p>
                    </div>
                  </div>
                </div>
              )}
            </div>

            {/* QR Scanner Simulator */}
            <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
              <h4 className="font-extrabold text-sm text-slate-800 flex items-center gap-2">
                <i className="fa-solid fa-qrcode text-emerald-700"></i>
                <span>Scanner Presensi Cepat</span>
              </h4>

              <div className="p-8 bg-slate-900 rounded-3xl text-center text-white space-y-4 border border-slate-800">
                <div className="w-16 h-16 mx-auto bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center text-2xl animate-pulse">
                  <i className="fa-solid fa-camera"></i>
                </div>
                <div>
                  <p className="text-xs font-bold text-slate-200">Scan Kartu / Masukkan NIS Siswa</p>
                  <p className="text-[10px] text-slate-400 mt-0.5">Sistem akan otomatis mencatat presensi 'HADIR' hari ini</p>
                </div>

                <form onSubmit={handleSimulateScan} className="flex gap-2 max-w-xs mx-auto pt-2">
                  <input 
                    type="text" 
                    placeholder="Ketik/Scan NIS..."
                    value={scanNisInput}
                    onChange={e => setScanNisInput(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl text-slate-900 text-xs font-mono font-bold focus:outline-none"
                  />
                  <button 
                    type="submit" 
                    className="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-blue-950 font-black rounded-xl text-xs transition"
                  >
                    Scan
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const UserSettingsView = ({ users, setUsers, classes, showToast, currentUser, setCurrentUser }) => {
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editUser, setEditUser] = useState(null);
      const [deleteTarget, setDeleteTarget] = useState(null);

      const [formData, setFormData] = useState({
        username: '', password: '', name: '', role: 'GURU', status: 'Aktif', classId: '', subject: ''
      });

      const handleOpenAdd = () => {
        setFormData({
          username: '', password: '', name: '', role: 'GURU', status: 'Aktif', classId: '', subject: ''
        });
        setEditUser(null);
        setIsModalOpen(true);
      };

      const handleOpenEdit = (u) => {
        setFormData({ ...u });
        setEditUser(u);
        setIsModalOpen(true);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.username.trim() || !formData.password.trim()) return;

        if (editUser) {
          const updated = users.map(u => u.id === editUser.id ? { ...u, ...formData } : u);
          setUsers(updated);
          if (currentUser.id === editUser.id) {
            setCurrentUser({ ...currentUser, ...formData });
          }
          showToast(`Akun ${formData.name} berhasil diperbarui!`);
        } else {
          const newUser = { id: genId(), ...formData };
          setUsers([...users, newUser]);
          showToast(`Akun ${formData.name} berhasil dibuat!`);
        }
        setIsModalOpen(false);
      };

      const handleDelete = () => {
        if (!deleteTarget) return;
        if (deleteTarget.id === currentUser.id) {
          showToast("Anda tidak dapat menghapus akun Anda sendiri!", "error");
          setDeleteTarget(null);
          return;
        }
        const updated = users.filter(u => u.id !== deleteTarget.id);
        setUsers(updated);
        showToast(`Akun ${deleteTarget.name} dihapus.`);
        setDeleteTarget(null);
      };

      return (
        <div className="space-y-6 animate-fade-in">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h3 className="text-lg font-extrabold text-slate-800">Pengaturan Akun & Akses Pengguna</h3>
              <p className="text-xs text-slate-500">Kelola kredensial Guru, Wali Kelas, dan Admin IT SMP Islam YTM 1 Bogor</p>
            </div>
            <button 
              onClick={handleOpenAdd}
              className="px-4 py-2.5 bg-blue-950 hover:bg-blue-900 text-white rounded-xl font-bold text-xs shadow-md transition flex items-center gap-2"
            >
              <i className="fa-solid fa-user-plus"></i>
              <span>Tambah Akun Pengguna</span>
            </button>
          </div>

          <div className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="bg-slate-100 text-slate-700 text-[11px] font-extrabold uppercase tracking-wider border-b border-slate-200">
                    <th className="py-3.5 px-4">Nama Pengguna</th>
                    <th className="py-3.5 px-4">Username</th>
                    <th className="py-3.5 px-4">Peran / Role</th>
                    <th className="py-3.5 px-4">Status</th>
                    <th className="py-3.5 px-4 text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 text-xs">
                  {users.map(u => (
                    <tr key={u.id} className="hover:bg-slate-50 transition">
                      <td className="py-3 px-4 font-bold text-slate-800">
                        {u.name}
                        {u.id === currentUser.id && (
                          <span className="ml-2 text-[10px] bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded-full">
                            Anda
                          </span>
                        )}
                      </td>
                      <td className="py-3 px-4 font-mono font-bold text-slate-600">{u.username}</td>
                      <td className="py-3 px-4">
                        <span className={`px-2.5 py-1 rounded-lg text-[10px] font-black uppercase ${
                          u.role === 'ADMIN' ? 'bg-blue-100 text-blue-900 border border-blue-200' :
                          u.role === 'WALI' ? 'bg-amber-100 text-amber-900 border border-amber-200' : 'bg-emerald-100 text-emerald-900 border border-emerald-200'
                        }`}>
                          {u.role}
                        </span>
                      </td>
                      <td className="py-3 px-4">
                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${u.status === 'Aktif' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                          {u.status}
                        </span>
                      </td>
                      <td className="py-3 px-4 text-center">
                        <div className="flex items-center justify-center gap-1">
                          <button 
                            onClick={() => handleOpenEdit(u)}
                            className="p-1.5 text-slate-600 hover:text-blue-700 hover:bg-blue-50 rounded-lg transition"
                          >
                            <i className="fa-solid fa-pen"></i>
                          </button>
                          {u.id !== currentUser.id && (
                            <button 
                              onClick={() => setDeleteTarget(u)}
                              className="p-1.5 text-slate-600 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition"
                            >
                              <i className="fa-solid fa-trash"></i>
                            </button>
                          )}
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* Add/Edit User Modal */}
          <Modal isOpen={isModalOpen} title={editUser ? "Edit Akun Pengguna" : "Buat Akun Pengguna Baru"} onClose={() => setIsModalOpen(false)}>
            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Nama Lengkap</label>
                <input 
                  type="text" 
                  required
                  placeholder="Nama Lengkap & Gelar..."
                  value={formData.name}
                  onChange={e => setFormData({ ...formData, name: e.target.value })}
                  className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-medium focus:outline-none focus:border-blue-700"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Username</label>
                  <input 
                    type="text" 
                    required
                    placeholder="Username login..."
                    value={formData.username}
                    onChange={e => setFormData({ ...formData, username: e.target.value })}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-mono focus:outline-none focus:border-blue-700"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Kata Sandi</label>
                  <input 
                    type="text" 
                    required
                    placeholder="Kata sandi..."
                    value={formData.password}
                    onChange={e => setFormData({ ...formData, password: e.target.value })}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-mono focus:outline-none focus:border-blue-700"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Peran Akses</label>
                  <select 
                    value={formData.role}
                    onChange={e => setFormData({ ...formData, role: e.target.value })}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-medium focus:outline-none focus:border-blue-700 bg-white"
                  >
                    <option value="ADMIN">ADMIN IT</option>
                    <option value="WALI">WALI KELAS</option>
                    <option value="GURU">GURU MAPEL</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Status Akun</label>
                  <select 
                    value={formData.status}
                    onChange={e => setFormData({ ...formData, status: e.target.value })}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-medium focus:outline-none focus:border-blue-700 bg-white"
                  >
                    <option value="Aktif">Aktif</option>
                    <option value="Nonaktif">Nonaktif</option>
                  </select>
                </div>
              </div>

              <div className="pt-2 flex justify-end gap-2">
                <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 text-xs font-bold text-slate-600 rounded-xl hover:bg-slate-100">Batal</button>
                <button type="submit" className="px-5 py-2 text-xs font-bold text-white bg-blue-950 hover:bg-blue-900 rounded-xl shadow-md">Simpan Akun</button>
              </div>
            </form>
          </Modal>

          <ConfirmModal 
            isOpen={!!deleteTarget}
            title="Hapus Akun Pengguna?"
            message={`Apakah Anda yakin ingin menghapus akun ${deleteTarget?.name} (${deleteTarget?.username})?`}
            onConfirm={handleDelete}
            onClose={() => setDeleteTarget(null)}
          />
        </div>
      );
    };

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
